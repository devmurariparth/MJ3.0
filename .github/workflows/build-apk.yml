name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js *.png www/

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          npx cap init "MJ AI Agent" "com.mj.aiagent" --web-dir www
          npx cap add android

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MJ-AI-Agent.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJ-AI-Agent-APK
          path: MJ-AI-Agent.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MJ AI Agent v1.0.0"
          body: "Official Android APK for MJ AI Agent. Download and install directly on your phone!"
          files: MJ-AI-Agent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
